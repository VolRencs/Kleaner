# qmllint reports a false positive for files that use `pragma Singleton` and are
# declared as singletons by the build system: linting such a file directly says
# "Type X not declared as singleton in qmldir". Keep the message visible but do
# not fail the build on it.
# TODO: drop the ImportFailure override once qmllint handles these files.

[General]
MaxWarnings=0

[Warnings]
ImportFailure=info
